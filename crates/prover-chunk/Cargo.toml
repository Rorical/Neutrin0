[package]
name          = "neutrin0-prover-chunk"
description   = "Deterministic consensus validation shared by the node and the Chunk, Evidence and Fact Guests."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
authors       = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
publish       = { workspace = true }

[features]
default = ["std"]
std = []
sp1-verification = ["dep:sp1-verifier", "dep:sp1-primitives", "dep:sp1-hypercube", "dep:sp1-recursion-executor", "dep:serde", "dep:bincode"]

[dependencies]
borsh = { workspace = true }
neutrin0-consensus-types = { workspace = true }
neutrin0-primitives = { workspace = true }
neutrin0-runtime-core = { workspace = true }
neutrin0-runtime-abi = { workspace = true }
neutrin0-vrf = { path = "../vrf", version = "0.1.0", default-features = false }
sha2 = { workspace = true }
# Hash-to-curve in upstream and SP1-patched BLS requires digest 0.10.
sha2_10 = { package = "sha2", version = "0.10.9", default-features = false }
# Compressed STARK verification is feature-gated separately from std in this SDK.
sp1-verifier = { version = "=6.10.0", default-features = false, features = ["full"], optional = true }
sp1-primitives = { version = "=6.10.0", optional = true }
sp1-hypercube = { version = "=6.10.0", optional = true }
sp1-recursion-executor = { version = "=6.10.0", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"], optional = true }
bincode = { workspace = true, optional = true }

# Native verification uses the current upstream release. The Guest uses the
# latest released SP1 BLS precompile patch, which is based on upstream 0.8.
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
bls12_381 = { version = "0.9.0", default-features = false, features = ["alloc", "pairings", "experimental"] }

[target.'cfg(target_os = "zkvm")'.dependencies]
bls12_381 = { version = "=0.8.0", default-features = false, features = ["alloc", "pairings", "experimental"] }

[dev-dependencies]
neutrin0-evm-runtime-core = { workspace = true }
neutrin0-runtime-system = { workspace = true }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { version = "=1.7.3", default-features = false }
k256 = { workspace = true }
neutrin0-runtime-core = { workspace = true, features = ["host"] }
neutrin0-crypto = { workspace = true }

[lints]
workspace = true
