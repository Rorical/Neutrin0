# Supply-chain policy checked in CI by cargo-deny.

[graph]
all-features = true

[advisories]
# Unmaintained crates count only when a workspace crate depends on them
# directly; the transitive ones arrive through SP1, alloy and wasmtime.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained without a known vulnerability; SP1 receipts and verifying-key caches are encoded with it" },
    # crypto-bigint 0.5.5 has no patched release. It is reached only through k256
    # 0.13 in alloy-consensus, which recovers senders from public signatures;
    # every secret-key operation uses k256 0.14 on the patched crypto-bigint 0.7.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 handles only public values here; the 0.7 line in use is patched" },
]

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft) for dynasm and
# option-ext. Crates offering a copyleft option alongside these, such as r-efi,
# are used under the permissive one.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
