global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    environment: private-staging
rule_files:
  - alerts.yml
  - expected-targets.yml
scrape_configs:
  - job_name: neutrin0
    metrics_path: /metrics
    sample_limit: 20000
    label_limit: 12
    scrape_protocols: [PrometheusText0.0.4]
    file_sd_configs:
      - files: [targets.json]
        refresh_interval: 30s
